[project]
name = "debttracker-api"
version = "0.1.0"
description = "REST API for DebtTracker Android app"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy",
    "alembic",
    "pydantic",
    "passlib[bcrypt]",
    "bcrypt<5",
    "python-jose[cryptography]",
    "slowapi",
    "ruff",
]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]
ignore = ["E501", "B008"]
exclude = [".venv", "data", "__pycache__"]

[tool.ruff.lint.per-file-ignores]
"app/models.py" = ["N815"]
"app/schemas.py" = ["N815", "UP042"]
"tests/conftest.py" = ["E402"]

[tool.ruff.format]
quote-style = "double"
