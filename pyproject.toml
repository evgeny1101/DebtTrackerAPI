[project]
name = "debttracker-api"
version = "0.4.1"
description = "REST API for DebtTracker Android app"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn[standard]==0.52.4",
    "sqlalchemy==2.0.52",
    "alembic==1.19.1",
    "pydantic==2.13.4",
    "passlib[bcrypt]==1.7.4",
    "bcrypt==4.3.0",
    "python-jose[cryptography]==3.5.0",
    "slowapi==0.1.10",
    "httpx==0.27.0",
]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]
ignore = ["E501", "B008"]
exclude = [".venv", "data", "__pycache__"]

[tool.ruff.lint.per-file-ignores]
"app/models.py" = ["N815"]
"app/schemas.py" = ["N815", "UP042"]
"tests/conftest.py" = ["E402"]

[tool.ruff.format]
quote-style = "double"
